name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vega-plugin-spine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Spine plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vega-plugin-spine
          persist-credentials: false

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: vega-plugin-spine/.dependencies/vega
          persist-credentials: false
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vega-plugin-spine/pnpm-lock.yaml
      - name: Check out vega-renderer-three
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-renderer-three
          ref: 33a9127d9537cc5c303fceaa35fafda403713b42
          path: vega-plugin-spine/.dependencies/vega-renderer-three
          persist-credentials: false
      - name: Check out render-shaders
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/render-shaders
          ref: 6bf76578c7ebdf318f5a3f5c198d01ac9235c853
          path: vega-plugin-spine/.dependencies/render-shaders
          persist-credentials: false
      - name: Set up locked Vega Rust and WASM tools
        uses: ./vega-plugin-spine/.dependencies/vega/.github/actions/setup-wasm

      - name: Install dependencies
        working-directory: vega-plugin-spine
        run: pnpm install --no-frozen-lockfile

      - name: Build Vega protocol
        working-directory: vega-plugin-spine
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build Vega core
        working-directory: vega-plugin-spine
        run: pnpm --filter @haneoka/vega build:core
      - name: Build additional pinned SDK dependencies
        working-directory: vega-plugin-spine
        run: |-
          pnpm --filter @haneoka/render-shaders build
          pnpm --filter @haneoka/vega-renderer-three build

      - name: Check package
        working-directory: vega-plugin-spine
        run: pnpm check

      - name: Inspect npm payload
        working-directory: vega-plugin-spine
        run: pnpm pack --dry-run
